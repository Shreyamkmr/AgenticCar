<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Agentic Car: your car's ECU, recorded in full and served to Claude over MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1418"/>
      <stop offset="1" stop-color="#3a2a2e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb4ab"/>
      <stop offset="1" stop-color="#ff8a65"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <!-- Gauge: 270 degree arc, needle near 70 % -->
  <g transform="translate(190 168)">
    <circle r="104" fill="none" stroke="#4a3a3e" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="490 654" transform="rotate(135)"/>
    <circle r="104" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="343 654" transform="rotate(135)"/>
    <line x1="0" y1="0" x2="62" y2="-52" stroke="#ffe0db" stroke-width="7" stroke-linecap="round"/>
    <circle r="12" fill="#ffe0db"/>
    <text y="62" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="600" fill="#d8c2bf" letter-spacing="2">OBD-II</text>
  </g>

  <text x="350" y="138" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72"
        font-weight="700" fill="#fff4f2">Agentic Car</text>
  <text x="352" y="190" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28"
        fill="#d8c2bf">Your car's ECU, recorded in full and served to Claude over MCP</text>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="352" y="222" width="196" height="40" rx="20" fill="#4a3a3e"/>
    <text x="450" y="249" text-anchor="middle" fill="#ffb4ab">120+ signals</text>
    <rect x="562" y="222" width="230" height="40" rx="20" fill="#4a3a3e"/>
    <text x="677" y="249" text-anchor="middle" fill="#ffb4ab">~1 byte / reading</text>
    <rect x="806" y="222" width="168" height="40" rx="20" fill="#4a3a3e"/>
    <text x="890" y="249" text-anchor="middle" fill="#ffb4ab">9 MCP tools</text>
    <rect x="988" y="222" width="232" height="40" rx="20" fill="#4a3a3e"/>
    <text x="1104" y="249" text-anchor="middle" fill="#ffb4ab">Wi-Fi or HTTPS</text>
  </g>
</svg>
